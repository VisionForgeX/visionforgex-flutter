name: visionforgex_flutter
description: "VisionForgeX ads for Flutter apps: Google Ad Manager demand with every decision (pacing, floors, refresh, consent, experiments) made on the platform."
version: 1.0.0
homepage: https://apps.visionforgex.com
repository: https://github.com/VisionForgeX/visionforgex-flutter

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.visionforgex.flutter
        pluginClass: VisionForgeXPlugin
      ios:
        pluginClass: VisionForgeXPlugin
