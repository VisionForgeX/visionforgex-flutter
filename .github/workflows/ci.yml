# Checks the plugin on GitHub's machines. Open the "Actions" tab of this repository to see the result.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  dart:
    name: Analyze and test (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  android:
    name: Build the example for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cd example && flutter create --platforms=android,ios . && flutter pub get && flutter build apk --debug
  ios:
    name: Build the example for iOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cd example && flutter create --platforms=android,ios . && flutter pub get
      - name: Take the VisionForgeX pod from GitHub (it is not on CocoaPods trunk yet)
        run: |
          cd example
          flutter build ios --config-only --no-codesign || true
          python3 -c "import re;p='ios/Podfile';s=open(p).read();s=re.sub(r\"(target 'Runner' do\n)\",r\"\1  pod 'VisionForgeX', :git => 'https://github.com/VisionForgeX/visionforgex-ios-sdk.git', :branch => 'main'\n\",s,1);open(p,'w').write(s)"
          sed -i.bak 's/^  use_frameworks!$/  use_frameworks! :linkage => :static/' ios/Podfile
          grep -n "VisionForgeX\|use_frameworks" ios/Podfile
      - run: cd example && flutter build ios --no-codesign --debug
