group = "com.visionforgex.flutter"
version = "1.0.1"

buildscript {
    ext.kotlin_version = "1.9.24"
    repositories { google(); mavenCentral() }
    dependencies {
        classpath("com.android.tools.build:gradle:8.5.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }   // where the VisionForgeX Android SDK is built
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.visionforgex.flutter"
    compileSdk = 35   // Google's Next-Gen SDK needs 35
    defaultConfig { minSdk = 24 }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        // the native SDK and Google's are built with a newer Kotlin than Flutter's default; their classes read fine
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
}

// Which of Google's Android SDKs the app runs on: "nextgen" (Google's GMA Next-Gen SDK, the default) or "gma"
// (Google Mobile Ads 25.x, retired by Google on 30 Jun 2028). Set it in the app's android/gradle.properties:
//   visionforgexEngine=gma
def vfxEngine = (rootProject.findProperty("visionforgexEngine") ?: "nextgen").toString()
// The native SDK's version; VFX_SDK_VERSION (a tag or a commit, which JitPack builds) is only for this repository's CI.
def vfxSdk = (System.getenv("VFX_SDK_VERSION") ?: "1.3.0").toString()

dependencies {
    api("com.github.VisionForgeX.visionforgex-android-sdk:${vfxEngine == "gma" ? "vfx-ads" : "vfx-ads-nextgen"}:${vfxSdk}")
}
